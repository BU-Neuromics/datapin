name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.5.0

  test:
    name: Test (race) + vet + fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            echo "Run 'gofmt -w .' to fix."
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Test with race detector
        run: go test -race ./...

      - name: Build
        run: go build ./...

      - name: Integration tests
        run: go test -tags integration -count=1 ./integration/...

  # Hermetic but real: the workspace drivers against a real MinIO and a
  # real OpenSSH sshd, not their in-process stand-ins (gofakes3 / piped
  # sftp). No secrets involved, so this runs on fork PRs too.
  workspace-protocols:
    name: Workspace protocols (real MinIO + OpenSSH)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Start MinIO and OpenSSH SFTP containers
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=datapin -e MINIO_ROOT_PASSWORD=datapin-secret \
            quay.io/minio/minio server /data
          docker run -d --name sftp -p 2222:22 atmoz/sftp demo:demopass:::upload

      - name: Wait for containers
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:9000/minio/health/live >/dev/null
          # atmoz/sftp generates host keys on first boot; ready once keyscan answers.
          for i in $(seq 1 30); do
            ssh-keyscan -p 2222 localhost 2>/dev/null | grep -q ssh- && break
            sleep 1
          done
          ssh-keyscan -p 2222 localhost 2>/dev/null | grep -q ssh-

      - name: Run real-protocol workspace tests
        env:
          DATAPIN_TEST_S3_ENDPOINT: localhost:9000
          DATAPIN_TEST_S3_ACCESS: datapin
          DATAPIN_TEST_S3_SECRET: datapin-secret
          DATAPIN_TEST_SFTP_URL: sftp://demo@localhost:2222/upload
          DATAPIN_TEST_SFTP_PASSWORD: demopass
        run: go test -tags live -count=1 -v ./internal/workspace/...

  cross-build:
    name: Cross-compile (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build for ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: go build ./...
